[package]
name = "yonix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A NixOS companion for the desktop, terminal and browser"
license = "GPL-3.0-or-later"

[features]
default = ["gui"]
gui = ["dep:adw"]

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"], optional = true }
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
