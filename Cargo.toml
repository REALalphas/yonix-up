[package]
name = "yonix"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "A NixOS companion for the desktop, terminal and browser"
license = "AGPL-3.0-or-later"
repository = "https://github.com/REALalphas/yonix-up"
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:adw"]

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"], optional = true }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
fs2 = "0.4"
if-addrs = "0.15"
socket2 = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
ring = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = { version = "0.4", default-features = false, features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
