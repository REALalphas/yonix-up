name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: [self-hosted, small]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - name: Validate workflows
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - name: Scan Git history for secrets
        run: nix shell --inputs-from . nixpkgs#gitleaks --command gitleaks git --redact --max-archive-depth=2 --log-opts=--all .

  frontend:
    name: Frontend
    runs-on: [self-hosted, small]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build production assets
        run: npm run build
      - name: Test browser model, rendering and translations
        run: npm test

  rust:
    name: Rust and GTK
    runs-on: [self-hosted, large-compute]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for the Nix store on the disposable runner
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = https://yonix.cachix.org
            extra-trusted-public-keys = yonix.cachix.org-1:tuJfS1bMNuVctofrHgbmUcfYcqLfjieOmOI42ccjaqg=
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Validate GitHub Actions workflows
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --check
      - name: Lint desktop and headless targets
        run: |
          nix develop --command cargo clippy --locked --all-targets -- -D warnings
          nix develop --command cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Test desktop and headless targets
        run: |
          nix develop --command cargo test --locked
          nix develop --command cargo test --locked --no-default-features
      - name: Test the native GTK window
        run: |
          nix develop --command xvfb-run -a dbus-run-session --config-file=tests/dbus-session.conf -- \
            env GDK_BACKEND=x11 GTK_A11Y=none \
            cargo test --locked --lib native_window_renders_and_connects -- --ignored --test-threads=1

  nix:
    name: Nix (${{ matrix.target }})
    runs-on: [self-hosted, large-compute]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - checks.x86_64-linux.package
          - packages.x86_64-linux.yonix-headless
          - checks.x86_64-linux.module
          - checks.x86_64-linux.clean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for the Nix store on the disposable runner
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = https://yonix.cachix.org
            extra-trusted-public-keys = yonix.cachix.org-1:tuJfS1bMNuVctofrHgbmUcfYcqLfjieOmOI42ccjaqg=
      - name: Build and test
        env:
          NIX_TARGET: ${{ matrix.target }}
        run: nix build --no-link --print-build-logs ".#$NIX_TARGET"

  nixos:
    name: NixOS VM (${{ matrix.check }})
    runs-on: [self-hosted, large-compute]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [vm, btrfs, peers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for VM closures on the disposable runner
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = https://yonix.cachix.org
            extra-trusted-public-keys = yonix.cachix.org-1:tuJfS1bMNuVctofrHgbmUcfYcqLfjieOmOI42ccjaqg=
            system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM for isolated NixOS tests
        run: |
          test -c /dev/kvm
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run VM test
        env:
          NIX_CHECK: ${{ matrix.check }}
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.$NIX_CHECK"
